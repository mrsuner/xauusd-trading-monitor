<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TickBase News publishes public-safe event radar summaries for XAUUSD, geopolitics, Fed, energy, and market-moving news."
    />
    <meta property="og:title" content="TickBase News" />
    <meta
      property="og:description"
      content="Public event radar for market-moving gold, macro, and geopolitics news."
    />
    <title>TickBase News</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tickbase-theme");
          if (t !== "tickbase-dark" && t !== "tickbase-light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "tickbase-dark" : "tickbase-light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <script src="/env.js"></script>
    <script>
      (function () {
        try {
          var gaId = (window.__TICKBASE_NEWS_CONFIG__ || {}).PUBLIC_GA_MEASUREMENT_ID;
          if (!gaId) return;
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(gaId);
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag("js", new Date());
          window.gtag("config", gaId);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
