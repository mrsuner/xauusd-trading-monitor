      ANOMALY_SSE_RECONNECT_INITIAL_BACKOFF_SECONDS: ${ANOMALY_SSE_RECONNECT_INITIAL_BACKOFF_SECONDS:-1}
      ANOMALY_SSE_RECONNECT_BACKOFF_SECONDS: ${ANOMALY_SSE_RECONNECT_BACKOFF_SECONDS:-30}
      ANOMALY_SSE_READ_TIMEOUT_SECONDS: ${ANOMALY_SSE_READ_TIMEOUT_SECONDS:-75}
      ANOMALY_SEVERITY_S_MULTIPLIER: ${ANOMALY_SEVERITY_S_MULTIPLIER:-3.0}
