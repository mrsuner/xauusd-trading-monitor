name: xauusd-event-radar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xauusd

  db-migrate:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/db-migrate:${IMAGE_TAG}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: db-migrate
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    command: ["alembic", "upgrade", "head"]
    networks:
      - xauusd

  telegram-collector:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/telegram-collector:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: telegram-collector
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION_PATH: ${TELEGRAM_SESSION_PATH}
      BACKFILL_HOURS: 6
      BACKFILL_LIMIT_PER_SOURCE: 500
      SOURCE_REFRESH_INTERVAL_SECONDS: 300
      HEALTH_UPDATE_INTERVAL_SECONDS: 30
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    volumes:
      - ${TELEGRAM_SESSION_HOST_DIR}:/app/sessions
    networks:
      - xauusd

  rss-collector:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/rss-collector:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: rss-collector
      DATABASE_URL: ${DATABASE_URL}
      DEFAULT_POLL_INTERVAL_SECONDS: 120
      DEFAULT_REQUEST_TIMEOUT_SECONDS: 15
      SOURCE_REFRESH_INTERVAL_SECONDS: 300
      HEALTH_UPDATE_INTERVAL_SECONDS: 30
      USER_AGENT: XAUUSD-Event-Radar/1.0
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  normalizer-classifier:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/normalizer-classifier:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: normalizer-classifier
      DATABASE_URL: ${DATABASE_URL}
      WORKER_CONCURRENCY: 4
      POLL_INTERVAL_SECONDS: 2
      MODEL_ROUTE: ${MODEL_ROUTE}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL}
      LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME}
      CLOUD_MODEL_BASE_URL: ${CLOUD_MODEL_BASE_URL}
      CLOUD_MODEL_API_KEY: ${CLOUD_MODEL_API_KEY}
      CLOUD_MODEL_NAME: ${CLOUD_MODEL_NAME}
      CLAUDE_CODE_AGENT_ENABLED: ${CLAUDE_CODE_AGENT_ENABLED}
      CLAUDE_CODE_AGENT_MODEL: ${CLAUDE_CODE_AGENT_MODEL}
      MODEL_TIMEOUT_SECONDS: 30
      RELEVANCE_THRESHOLD_EVENT: 70
      RELEVANCE_THRESHOLD_PUSHOVER: 85
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  alert-dispatcher:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/alert-dispatcher:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: alert-dispatcher
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
      PUSHOVER_EMERGENCY_RETRY_SECONDS: ${PUSHOVER_EMERGENCY_RETRY_SECONDS}
      PUSHOVER_EMERGENCY_EXPIRE_SECONDS: ${PUSHOVER_EMERGENCY_EXPIRE_SECONDS}
      POLL_INTERVAL_SECONDS: 2
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  dashboard-api:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/dashboard-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: dashboard-api
      DATABASE_URL: ${DATABASE_URL}
      API_TOKEN: ${API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEFAULT_PAGE_SIZE: 50
      MAX_PAGE_SIZE: 200
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    ports:
      - "8080:8080"
    networks:
      - xauusd

volumes:
  postgres-data:

networks:
  xauusd:
    driver: bridge
