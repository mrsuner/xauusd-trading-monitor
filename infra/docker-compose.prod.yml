  public-syncer:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/public-syncer:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - public-website
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: public-syncer
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      PUBLIC_SYNCER_ENABLED: ${PUBLIC_SYNCER_ENABLED:-false}
      PUBLIC_SYNCER_DRY_RUN: ${PUBLIC_SYNCER_DRY_RUN:-true}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PUBLIC_INGEST_PATH: ${PUBLIC_INGEST_PATH:-/ingest/events}
      PUBLIC_SYNC_AUTH_MODE: ${PUBLIC_SYNC_AUTH_MODE:-hmac}
      PUBLIC_SYNC_KEY_ID: ${PUBLIC_SYNC_KEY_ID:-}
      PUBLIC_SYNC_SECRET: ${PUBLIC_SYNC_SECRET:-}
      PUBLIC_SYNC_API_KEY: ${PUBLIC_SYNC_API_KEY:-}
      PUBLIC_SYNCER_BATCH_SIZE: ${PUBLIC_SYNCER_BATCH_SIZE:-10}
      PUBLIC_SYNCER_MAX_ATTEMPTS: ${PUBLIC_SYNCER_MAX_ATTEMPTS:-5}
      PUBLIC_SYNCER_RETRY_BACKOFF_SECONDS: ${PUBLIC_SYNCER_RETRY_BACKOFF_SECONDS:-60}
      PUBLIC_SYNCER_MAX_PER_MINUTE: ${PUBLIC_SYNCER_MAX_PER_MINUTE:-60}
      PUBLIC_SYNCER_PROVIDER_TIMEOUT_SECONDS: ${PUBLIC_SYNCER_PROVIDER_TIMEOUT_SECONDS:-10}
      PUBLIC_SYNCER_LOCK_TIMEOUT_SECONDS: ${PUBLIC_SYNCER_LOCK_TIMEOUT_SECONDS:-300}
      PUBLIC_SYNCER_POLL_INTERVAL_SECONDS: ${PUBLIC_SYNCER_POLL_INTERVAL_SECONDS:-10}
      PUBLIC_RAW_INGEST_PATH: ${PUBLIC_RAW_INGEST_PATH:-/ingest/raw-items}
      PUBLIC_SYNC_RAW_ITEMS_ENABLED: ${PUBLIC_SYNC_RAW_ITEMS_ENABLED:-false}
      PUBLIC_RAW_BACKFILL_ENABLED: ${PUBLIC_RAW_BACKFILL_ENABLED:-false}
      PUBLIC_RAW_BATCH_SIZE: ${PUBLIC_RAW_BATCH_SIZE:-20}
      PUBLIC_RAW_MAX_PER_MINUTE: ${PUBLIC_RAW_MAX_PER_MINUTE:-30}
      PUBLIC_RAW_MIN_RELEVANCE_SCORE: ${PUBLIC_RAW_MIN_RELEVANCE_SCORE:-50}
      PUBLIC_RAW_MAX_ORIGINAL_CHARS: ${PUBLIC_RAW_MAX_ORIGINAL_CHARS:-4000}
      PUBLIC_RAW_MAX_TRANSLATION_CHARS: ${PUBLIC_RAW_MAX_TRANSLATION_CHARS:-8000}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  dashboard-api:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/dashboard-api:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: dashboard-api
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      API_TOKEN: ${API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEFAULT_PAGE_SIZE: 50
      MAX_PAGE_SIZE: 200
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    ports:
      - "${DASHBOARD_API_HOST:-127.0.0.1}:${DASHBOARD_API_HOST_PORT:-8080}:8080"
    networks:
      - xauusd

  dashboard-web:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/dashboard-web:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      dashboard-api:
        condition: service_started
    environment:
      DASHBOARD_API_BASE_URL: ${DASHBOARD_API_BASE_URL}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN}
      TZ: ${TZ}
    ports:
      - "${DASHBOARD_WEB_HOST:-0.0.0.0}:${DASHBOARD_WEB_HOST_PORT:-5173}:8080"
    networks:
      - xauusd

volumes:
  postgres-data:

networks:
  xauusd:
    driver: bridge
