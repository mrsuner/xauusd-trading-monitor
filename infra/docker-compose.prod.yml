name: xauusd-event-radar

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-100m}
    max-file: "${DOCKER_LOG_MAX_FILE:-45}"

services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xauusd

  db-migrate:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/db-migrate:${IMAGE_TAG}
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: db-migrate
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    command: ["alembic", "upgrade", "head"]
    networks:
      - xauusd

  telegram-collector:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/telegram-collector:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: telegram-collector
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION_PATH: ${TELEGRAM_SESSION_PATH}
      BACKFILL_HOURS: 6
      BACKFILL_LIMIT_PER_SOURCE: 500
      SOURCE_REFRESH_INTERVAL_SECONDS: 300
      HEALTH_UPDATE_INTERVAL_SECONDS: 30
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    volumes:
      - ${TELEGRAM_SESSION_HOST_DIR}:/app/sessions
    networks:
      - xauusd

  rss-collector:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/rss-collector:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: rss-collector
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      DEFAULT_POLL_INTERVAL_SECONDS: 120
      DEFAULT_REQUEST_TIMEOUT_SECONDS: 15
      SOURCE_REFRESH_INTERVAL_SECONDS: 300
      HEALTH_UPDATE_INTERVAL_SECONDS: 30
      USER_AGENT: XAUUSD-Event-Radar/1.0
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  normalizer-classifier:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/normalizer-classifier:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: normalizer-classifier
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      WORKER_CONCURRENCY: ${NORMALIZER_WORKER_CONCURRENCY:-2}
      DB_POOL_MIN_SIZE: ${NORMALIZER_DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${NORMALIZER_DB_POOL_MAX_SIZE:-0}
      POLL_INTERVAL_SECONDS: 2
      STALE_TASK_TIMEOUT_SECONDS: ${NORMALIZER_STALE_TASK_TIMEOUT_SECONDS:-900}
      MODEL_ROUTE: ${MODEL_ROUTE}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL}
      LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME}
      LOCAL_MODEL_RESPONSE_FORMAT: ${LOCAL_MODEL_RESPONSE_FORMAT}
      LOCAL_MODEL_REASONING_EFFORT: ${LOCAL_MODEL_REASONING_EFFORT}
      CLOUD_MODEL_BASE_URL: ${CLOUD_MODEL_BASE_URL}
      CLOUD_MODEL_API_KEY: ${CLOUD_MODEL_API_KEY}
      CLOUD_MODEL_NAME: ${CLOUD_MODEL_NAME}
      CLOUD_MODEL_RESPONSE_FORMAT: ${CLOUD_MODEL_RESPONSE_FORMAT}
      CLOUD_MODEL_REASONING_EFFORT: ${CLOUD_MODEL_REASONING_EFFORT}
      AUXILIARY_MODEL_ENABLED: ${AUXILIARY_MODEL_ENABLED:-false}
      AUXILIARY_MODEL_ROUTE: ${AUXILIARY_MODEL_ROUTE:-disabled}
      OPENROUTER_MODEL_BASE_URL: ${OPENROUTER_MODEL_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL_API_KEY: ${OPENROUTER_MODEL_API_KEY}
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME}
      OPENROUTER_MODEL_RESPONSE_FORMAT: ${OPENROUTER_MODEL_RESPONSE_FORMAT:-json_object}
      OPENROUTER_MODEL_REASONING_EFFORT: ${OPENROUTER_MODEL_REASONING_EFFORT}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-XAUUSD Event Radar}
      TRANSLATION_MODEL_ENABLED: ${TRANSLATION_MODEL_ENABLED:-true}
      TRANSLATION_MODEL_BASE_URL: ${TRANSLATION_MODEL_BASE_URL:-https://openrouter.ai/api/v1}
      TRANSLATION_MODEL_API_KEY: ${TRANSLATION_MODEL_API_KEY:-}
      TRANSLATION_PRIMARY_MODEL_NAME: ${TRANSLATION_PRIMARY_MODEL_NAME:-openai/gpt-oss-20b:free}
      TRANSLATION_FALLBACK_MODEL_NAME: ${TRANSLATION_FALLBACK_MODEL_NAME:-openai/gpt-oss-20b}
      TRANSLATION_PAID_FALLBACK_ENABLED: ${TRANSLATION_PAID_FALLBACK_ENABLED:-true}
      TRANSLATION_MODEL_RESPONSE_FORMAT: ${TRANSLATION_MODEL_RESPONSE_FORMAT:-none}
      TRANSLATION_MODEL_REASONING_EFFORT: ${TRANSLATION_MODEL_REASONING_EFFORT}
      TRANSLATION_HTTP_REFERER: ${TRANSLATION_HTTP_REFERER}
      TRANSLATION_APP_TITLE: ${TRANSLATION_APP_TITLE:-XAUUSD Event Radar}
      TRANSLATION_DEFAULT_MAX_CHARS: ${TRANSLATION_DEFAULT_MAX_CHARS:-20000}
      TRANSLATION_HIGH_PRIORITY_MAX_CHARS: ${TRANSLATION_HIGH_PRIORITY_MAX_CHARS:-100000}
      TRANSLATION_SINGLE_CALL_MAX_CHARS: ${TRANSLATION_SINGLE_CALL_MAX_CHARS:-100000}
      MAX_CLASSIFICATION_CALLS_PER_RUN: ${MAX_CLASSIFICATION_CALLS_PER_RUN:-0}
      MAX_TRANSLATION_CALLS_PER_RUN: ${MAX_TRANSLATION_CALLS_PER_RUN:-0}
      MAX_TRANSLATION_PAID_FALLBACK_CALLS_PER_RUN: ${MAX_TRANSLATION_PAID_FALLBACK_CALLS_PER_RUN:-0}
      CLAUDE_CODE_AGENT_ENABLED: ${CLAUDE_CODE_AGENT_ENABLED}
      CLAUDE_CODE_AGENT_MODEL: ${CLAUDE_CODE_AGENT_MODEL}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      MAX_MODEL_CALLS_PER_RUN: ${MAX_MODEL_CALLS_PER_RUN:-0}
      RELEVANCE_THRESHOLD_EVENT: 70
      RELEVANCE_THRESHOLD_PUSHOVER: 85
      LOG_LEVEL: ${NORMALIZER_LOG_LEVEL:-${LOG_LEVEL}}
      TZ: ${TZ}
    networks:
      - xauusd

  alert-dispatcher:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/alert-dispatcher:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: alert-dispatcher
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
      PUSHOVER_EMERGENCY_RETRY_SECONDS: ${PUSHOVER_EMERGENCY_RETRY_SECONDS}
      PUSHOVER_EMERGENCY_EXPIRE_SECONDS: ${PUSHOVER_EMERGENCY_EXPIRE_SECONDS}
      ENABLE_TELEGRAM_ALERTS: ${ENABLE_TELEGRAM_ALERTS:-true}
      ENABLE_PUSHOVER_ALERTS: ${ENABLE_PUSHOVER_ALERTS:-true}
      ENABLE_POLLING_FALLBACK: "false"
      ALERT_DRY_RUN: ${ALERT_DRY_RUN:-false}
      ALERT_BACKFILL_MODE: ${ALERT_BACKFILL_MODE:-telegram_only}
      DISPATCH_EXISTING_EVENTS_ON_START: "false"
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      EVENT_LOOKBACK_MINUTES: ${EVENT_LOOKBACK_MINUTES:-120}
      EVENT_BATCH_SIZE: ${EVENT_BATCH_SIZE:-50}
      ALERT_BATCH_SIZE: ${ALERT_BATCH_SIZE:-10}
      MAX_ALERTS_PER_RUN: ${MAX_ALERTS_PER_RUN:-0}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      INITIAL_BACKOFF_SECONDS: ${INITIAL_BACKOFF_SECONDS:-10}
      MAX_BACKOFF_SECONDS: ${MAX_BACKOFF_SECONDS:-300}
      ALERT_PROVIDER_TIMEOUT_SECONDS: ${ALERT_PROVIDER_TIMEOUT_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  event-router:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/event-router:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: event-router
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      ENABLE_PRIVATE_TELEGRAM_ROUTE: ${ENABLE_PRIVATE_TELEGRAM_ROUTE:-true}
      ENABLE_PRIVATE_PUSHOVER_ROUTE: ${ENABLE_PRIVATE_PUSHOVER_ROUTE:-true}
      ENABLE_PUBLIC_TELEGRAM_CHANNEL_ROUTE: ${ENABLE_PUBLIC_TELEGRAM_CHANNEL_ROUTE:-true}
      ENABLE_PUBLIC_WEBSITE_ROUTE: ${ENABLE_PUBLIC_WEBSITE_ROUTE:-false}
      ENABLE_PUBLIC_X_ROUTE: ${ENABLE_PUBLIC_X_ROUTE:-false}
      EVENT_ROUTER_DISPATCH_EXISTING_EVENTS_ON_START: ${EVENT_ROUTER_DISPATCH_EXISTING_EVENTS_ON_START:-false}
      EVENT_ROUTER_BACKFILL_MODE: ${EVENT_ROUTER_BACKFILL_MODE:-telegram_only}
      EVENT_ROUTER_POLL_INTERVAL_SECONDS: ${EVENT_ROUTER_POLL_INTERVAL_SECONDS:-2}
      EVENT_ROUTER_LOOKBACK_MINUTES: ${EVENT_ROUTER_LOOKBACK_MINUTES:-120}
      EVENT_ROUTER_BATCH_SIZE: ${EVENT_ROUTER_BATCH_SIZE:-50}
      EVENT_ROUTER_MAX_EVENTS_PER_RUN: ${EVENT_ROUTER_MAX_EVENTS_PER_RUN:-0}
      PRIVATE_TELEGRAM_ROUTE_SCORE_THRESHOLD: ${PRIVATE_TELEGRAM_ROUTE_SCORE_THRESHOLD:-45}
      PRIVATE_TELEGRAM_S_ROUTE_SCORE_THRESHOLD: ${PRIVATE_TELEGRAM_S_ROUTE_SCORE_THRESHOLD:-35}
      PRIVATE_PUSHOVER_ROUTE_SCORE_THRESHOLD: ${PRIVATE_PUSHOVER_ROUTE_SCORE_THRESHOLD:-85}
      PUBLIC_TELEGRAM_ROUTE_SCORE_THRESHOLD: ${PUBLIC_TELEGRAM_ROUTE_SCORE_THRESHOLD:-65}
      PUBLIC_WEBSITE_ROUTE_SCORE_THRESHOLD: ${PUBLIC_WEBSITE_ROUTE_SCORE_THRESHOLD:-50}
      PUBLIC_X_ROUTE_SCORE_THRESHOLD: ${PUBLIC_X_ROUTE_SCORE_THRESHOLD:-85}
      PUBLIC_X_A_RELEVANCE_THRESHOLD: ${PUBLIC_X_A_RELEVANCE_THRESHOLD:-90}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  telegram-channel-publisher:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/telegram-channel-publisher:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - public-publishing
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: telegram-channel-publisher
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      TELEGRAM_CHANNEL_PUBLISHER_ENABLED: ${TELEGRAM_CHANNEL_PUBLISHER_ENABLED:-false}
      TELEGRAM_CHANNEL_DRY_RUN: ${TELEGRAM_CHANNEL_DRY_RUN:-true}
      TELEGRAM_CHANNEL_BOT_TOKEN: ${TELEGRAM_CHANNEL_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_CHANNEL_PARSE_MODE: ${TELEGRAM_CHANNEL_PARSE_MODE:-HTML}
      TELEGRAM_CHANNEL_DISABLE_WEB_PAGE_PREVIEW: ${TELEGRAM_CHANNEL_DISABLE_WEB_PAGE_PREVIEW:-false}
      TELEGRAM_CHANNEL_MIN_SEVERITY: ${TELEGRAM_CHANNEL_MIN_SEVERITY:-A}
      TELEGRAM_CHANNEL_INCLUDE_B_EVENTS: ${TELEGRAM_CHANNEL_INCLUDE_B_EVENTS:-false}
      TELEGRAM_CHANNEL_MAX_PER_HOUR: ${TELEGRAM_CHANNEL_MAX_PER_HOUR:-30}
      TELEGRAM_CHANNEL_MAX_ATTEMPTS: ${TELEGRAM_CHANNEL_MAX_ATTEMPTS:-5}
      TELEGRAM_CHANNEL_RETRY_BACKOFF_SECONDS: ${TELEGRAM_CHANNEL_RETRY_BACKOFF_SECONDS:-60}
      TELEGRAM_CHANNEL_BATCH_SIZE: ${TELEGRAM_CHANNEL_BATCH_SIZE:-5}
      TELEGRAM_CHANNEL_PROVIDER_TIMEOUT_SECONDS: ${TELEGRAM_CHANNEL_PROVIDER_TIMEOUT_SECONDS:-10}
      TELEGRAM_CHANNEL_LOCK_TIMEOUT_SECONDS: ${TELEGRAM_CHANNEL_LOCK_TIMEOUT_SECONDS:-300}
      TELEGRAM_CHANNEL_MESSAGE_LIMIT_CHARS: ${TELEGRAM_CHANNEL_MESSAGE_LIMIT_CHARS:-3900}
      PUBLISHER_POLL_INTERVAL_SECONDS: ${PUBLISHER_POLL_INTERVAL_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - xauusd

  tickbase-anomaly-consumer:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/tickbase-anomaly-consumer:${IMAGE_TAG}
