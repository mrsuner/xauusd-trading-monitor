      TRANSLATION_HTTP_REFERER: ${TRANSLATION_HTTP_REFERER}
      TRANSLATION_APP_TITLE: ${TRANSLATION_APP_TITLE:-XAUUSD Event Radar}
      OPENROUTER_MODEL_API_KEY: ${OPENROUTER_MODEL_API_KEY}
