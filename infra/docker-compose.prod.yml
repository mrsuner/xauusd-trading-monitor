      X_PUBLISHER_MAX_PER_HOUR: ${X_PUBLISHER_MAX_PER_HOUR:-10}
      X_PUBLISHER_MAX_PER_DAY: ${X_PUBLISHER_MAX_PER_DAY:-50}
