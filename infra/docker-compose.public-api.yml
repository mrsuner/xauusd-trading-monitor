name: xauusd-public-api

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-100m}
    max-file: "${DOCKER_LOG_MAX_FILE:-45}"

services:
  public-postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${PUBLIC_POSTGRES_DB}
      POSTGRES_USER: ${PUBLIC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PUBLIC_POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - public-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PUBLIC_POSTGRES_USER} -d ${PUBLIC_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xauusd-public

  public-api-migrate:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/public-api:${IMAGE_TAG}
    restart: "no"
    logging: *default-logging
    depends_on:
      public-postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: public-api-migrate
      PUBLIC_DATABASE_URL: ${PUBLIC_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    networks:
      - xauusd-public

  public-api:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/public-api:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      public-postgres:
        condition: service_healthy
      public-api-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: public-api
      PUBLIC_DATABASE_URL: ${PUBLIC_DATABASE_URL}
      DB_CONNECT_MAX_ATTEMPTS: ${DB_CONNECT_MAX_ATTEMPTS:-10}
      DB_CONNECT_INITIAL_BACKOFF_SECONDS: ${DB_CONNECT_INITIAL_BACKOFF_SECONDS:-1}
      DB_CONNECT_MAX_BACKOFF_SECONDS: ${DB_CONNECT_MAX_BACKOFF_SECONDS:-30}
      PUBLIC_INGEST_AUTH_MODE: ${PUBLIC_INGEST_AUTH_MODE:-hmac}
      PUBLIC_INGEST_KEY_ID: ${PUBLIC_INGEST_KEY_ID:-}
      PUBLIC_INGEST_SECRET: ${PUBLIC_INGEST_SECRET:-}
      PUBLIC_API_TOKEN: ${PUBLIC_API_TOKEN:-}
      PUBLIC_INGEST_MAX_BODY_BYTES: ${PUBLIC_INGEST_MAX_BODY_BYTES:-262144}
      PUBLIC_INGEST_TIMESTAMP_SKEW_SECONDS: ${PUBLIC_INGEST_TIMESTAMP_SKEW_SECONDS:-300}
      PUBLIC_INGEST_MAX_SUMMARY_CHARS: ${PUBLIC_INGEST_MAX_SUMMARY_CHARS:-4000}
      PUBLIC_INGEST_MAX_TITLE_CHARS: ${PUBLIC_INGEST_MAX_TITLE_CHARS:-500}
      PUBLIC_INGEST_MAX_ORIGINAL_CONTENT_CHARS: ${PUBLIC_INGEST_MAX_ORIGINAL_CONTENT_CHARS:-4000}
      PUBLIC_INGEST_MAX_FULL_TRANSLATION_CHARS: ${PUBLIC_INGEST_MAX_FULL_TRANSLATION_CHARS:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://news.thetickbase.com}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-20}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-100}
      PUBLIC_DEFAULT_LANGUAGE: ${PUBLIC_DEFAULT_LANGUAGE:-en}
      PUBLIC_LANGUAGE_PRIORITY: ${PUBLIC_LANGUAGE_PRIORITY:-en,zh-Hant}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    ports:
      - "${PUBLIC_API_HOST:-127.0.0.1}:${PUBLIC_API_HOST_PORT:-8080}:8080"
    networks:
      - xauusd-public

  notification-redis:
    image: redis:7.4.9-alpine
    profiles: ["notifications"]
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xauusd-public

  notification-migrate:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/notification:${NOTIFICATION_IMAGE_TAG:-${IMAGE_TAG}}
    profiles: ["notifications"]
    restart: "no"
    logging: *default-logging
    depends_on:
      public-postgres:
        condition: service_healthy
    env_file:
      - ${NOTIFICATION_ENV_FILE:-../../infra/notification.env}
    command: ["php", "artisan", "migrate", "--force"]
    networks:
      - xauusd-public

  notification-api:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/notification:${NOTIFICATION_IMAGE_TAG:-${IMAGE_TAG}}
    profiles: ["notifications"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      notification-redis:
        condition: service_healthy
    env_file:
      - ${NOTIFICATION_ENV_FILE:-../../infra/notification.env}
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    networks:
      - xauusd-public

  notification-scheduler:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/notification:${NOTIFICATION_IMAGE_TAG:-${IMAGE_TAG}}
    profiles: ["notifications"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      notification-redis:
        condition: service_healthy
    env_file:
      - ${NOTIFICATION_ENV_FILE:-../../infra/notification.env}
    command: ["php", "artisan", "schedule:work"]
    networks:
      - xauusd-public

  notification-horizon:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/notification:${NOTIFICATION_IMAGE_TAG:-${IMAGE_TAG}}
    profiles: ["notifications"]
    restart: unless-stopped
    stop_grace_period: 3m
    logging: *default-logging
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      notification-redis:
        condition: service_healthy
    env_file:
      - ${NOTIFICATION_ENV_FILE:-../../infra/notification.env}
    command: ["php", "artisan", "horizon"]
    networks:
      - xauusd-public

volumes:
  public-postgres-data:
  notification-redis-data:

networks:
  xauusd-public:
    driver: bridge
