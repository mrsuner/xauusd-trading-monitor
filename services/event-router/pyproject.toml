[project]
name = "event-router"
version = "0.1.0"
description = "Route normalized events to private alerts and public outbox queues"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2.3,<4.0",
  "pydantic>=2.10.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
]

[project.scripts]
event-router = "event_router.__main__:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
