[project]
name = "rss-collector"
version = "0.1.0"
description = "RSS and HTML polling collector for XAUUSD Event Radar"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11,<7.0",
  "httpx>=0.28.0,<1.0",
  "psycopg[binary]>=3.2.3,<4.0",
  "pydantic>=2.10.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "selectolax>=0.3.25,<1.0",
]

[project.scripts]
rss-collector = "rss_collector.__main__:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
