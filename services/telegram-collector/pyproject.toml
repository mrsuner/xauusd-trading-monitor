[project]
name = "telegram-collector"
version = "0.1.0"
description = "Telegram collector for XAUUSD Event Radar"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2.3,<4.0",
  "pydantic>=2.10.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "telethon>=1.38.0,<2.0",
]

[project.scripts]
telegram-collector = "telegram_collector.__main__:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
